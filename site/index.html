  <script>
    (function () {
      const SHELL_SESSION_STORAGE_KEY = 'smart_filter_shell_session';
      const REGISTRY_SESSION_STORAGE_KEY = 'smart_filter_shell_registry_session';
      const ALLOWED_APPS = new Set(['site', 'mpro']);
      const SIDEBAR_PANEL_KEYS = new Set(['registry', 'categories', 'analytics', 'projects', 'data']);

      function normalizeAllowedApps(user) {
        if (!user || typeof user !== 'object') return [];
        const apps = user.apps && typeof user.apps === 'object' && !Array.isArray(user.apps)
          ? user.apps
          : {};
        const rawValue = user.allowedApps != null ? user.allowedApps : user.allowed_apps;
        const source = Array.isArray(rawValue)
          ? rawValue
          : (typeof rawValue === 'string' ? rawValue.split(/[,\s;|]+/) : []);
        const out = [];
        source.forEach(item => {
          const code = String(item || '').trim().toLowerCase();
          if (!code || !ALLOWED_APPS.has(code) || out.indexOf(code) !== -1) return;
          out.push(code);
        });
        if (!out.length) {
          Object.keys(apps).forEach(key => {
            const code = String(key || '').trim().toLowerCase();
            if (!code || !ALLOWED_APPS.has(code) || out.indexOf(code) !== -1) return;
            out.push(code);
          });
        }
        return out;
      }

      function readWarmSiteSession() {
        let raw = '';
        try {
          raw = String(window.sessionStorage.getItem(SHELL_SESSION_STORAGE_KEY) || '');
        } catch (_error) {
          return null;
        }
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          const expiresAt = String(parsed && parsed.expiresAt || '').trim();
          if (expiresAt) {
            const expiryMs = Date.parse(expiresAt);
            if (Number.isFinite(expiryMs) && expiryMs <= Date.now()) return null;
          }
          if (!parsed || !parsed.user || !String(parsed.sessionToken || '').trim()) return null;
          if (normalizeAllowedApps(parsed.user).indexOf('site') === -1) return null;
          return parsed;
        } catch (_error) {
          return null;
        }
      }

      const bootSession = readWarmSiteSession();
      function normalizeSidebarPanel(value) {
        const normalized = String(value || '').trim();
        return SIDEBAR_PANEL_KEYS.has(normalized) ? normalized : 'registry';
      }
      function normalizeCurrentView(value) {
        const normalized = String(value || '').trim();
        return normalized === 'object' || normalized === 'analytics' ? normalized : 'registry';
      }
      function readWarmNavState() {
        let raw = '';
        try {
          raw = String(window.localStorage.getItem(REGISTRY_SESSION_STORAGE_KEY) || '');
        } catch (_error) {
          return null;
        }
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          return {
            currentView: normalizeCurrentView(parsed && parsed.currentView),
            sidebarExpanded: parsed && parsed.sidebarExpanded !== undefined ? !!parsed.sidebarExpanded : true,
            sidebarActivePanel: normalizeSidebarPanel(parsed && parsed.sidebarActivePanel),
            registrySidebarPanelOpen: parsed && parsed.registrySidebarPanelOpen !== undefined ? !!parsed.registrySidebarPanelOpen : true
          };
        } catch (_error) {
          return null;
        }
      }
      window.__SITE_BOOT_SESSION__ = bootSession;
      window.__SITE_BOOT_NAV__ = readWarmNavState();
      if (bootSession) {
        document.documentElement.classList.add('site-has-warm-session');
      }
    })();
  </script>

    <script>
      (function () {
        const bootSession = window.__SITE_BOOT_SESSION__;
        if (!bootSession || !bootSession.user || !bootSession.sessionToken) return;

        function normalizeText(value) {
          return String(value == null ? '' : value).trim();
        }

        function normalizeSessionApps(apps) {
          const source = apps && typeof apps === 'object' && !Array.isArray(apps) ? apps : {};
          const out = {};
          Object.keys(source).forEach(key => {
            const appCode = String(key || '').trim().toLowerCase();
            if (!appCode) return;
            const profile = source[key] && typeof source[key] === 'object' ? source[key] : {};
            out[appCode] = {
              role: normalizeText(profile.role),
              division: normalizeText(profile.division)
            };
          });
          return out;
        }

        function normalizeAllowedApps(user) {
          const apps = normalizeSessionApps(user && user.apps);
          const rawValue = user && user.allowedApps != null ? user.allowedApps : user && user.allowed_apps;
          const source = Array.isArray(rawValue)
            ? rawValue
            : (typeof rawValue === 'string' ? rawValue.split(/[,\s;|]+/) : []);
          const out = [];
          source.forEach(item => {
            const code = String(item || '').trim().toLowerCase();
            if (!code || out.indexOf(code) !== -1) return;
            out.push(code);
          });
          if (!out.length) {
            Object.keys(apps).forEach(code => {
              if (out.indexOf(code) !== -1) return;
              out.push(code);
            });
          }
          return { apps, allowedApps: out };
        }

        const user = bootSession.user;
        const sessionMeta = normalizeAllowedApps(user);
        const siteProfile = sessionMeta.allowedApps.indexOf('site') !== -1
          ? (sessionMeta.apps.site || { role: normalizeText(user.role), division: normalizeText(user.division) })
          : null;
        const role = siteProfile ? (siteProfile.role || normalizeText(user.role)) : normalizeText(user.role);
        const division = siteProfile ? (siteProfile.division || normalizeText(user.division)) : normalizeText(user.division);
        const displayRole = division ? `${role || 'Пользователь'} · ${division}` : (role || 'Пользователь');
        const canOpenMpro = sessionMeta.allowedApps.indexOf('mpro') !== -1 || !!sessionMeta.apps.mpro;

        const card = document.getElementById('userSessionCard');
        const nameNode = document.getElementById('userSessionName');
        const roleNode = document.getElementById('userSessionRole');
        const logoutButton = document.getElementById('btnLogout');
        const mproButton = document.getElementById('btnNavMpro');
        const mproNavItem = mproButton ? mproButton.closest('.nav-item') : null;

        if (card && nameNode && roleNode) {
          nameNode.textContent = normalizeText(user.name) || 'Пользователь';
          roleNode.textContent = displayRole;
          card.classList.remove('hidden');
        }
        if (logoutButton) {
          logoutButton.classList.remove('hidden');
        }
        if (mproNavItem) {
          mproNavItem.classList.toggle('hidden', !canOpenMpro);
        } else if (mproButton) {
          mproButton.classList.toggle('hidden', !canOpenMpro);
        }
        if (mproButton) {
          const title = canOpenMpro ? 'Открыть M-PRO' : 'Нет доступа к M-PRO';
          mproButton.disabled = !canOpenMpro;
          mproButton.title = title;
          mproButton.setAttribute('aria-label', title);
        }
      })();
    </script>

  <script>
    (function () {
      const bootSession = window.__SITE_BOOT_SESSION__;
      const bootNav = window.__SITE_BOOT_NAV__ || null;
      const panelKeys = ['registry', 'categories', 'analytics', 'projects', 'data'];
      const buttonIds = {
        registry: 'btnNavRegistry',
        categories: 'btnNavCategories',
        analytics: 'btnNavAnalytics',
        projects: 'btnNavProjects',
        data: 'btnNavData'
      };
      const panelIds = {
        registry: 'sidebarRegistryPanel',
        categories: 'sidebarCategoriesPanel',
        analytics: 'sidebarAnalyticsPanel',
        projects: 'sidebarProjectsPanel',
        data: 'sidebarDataPanel'
      };

      function normalizeText(value) {
        return String(value == null ? '' : value).trim();
      }

      function normalizeSidebarPanel(value) {
        const normalized = normalizeText(value);
        return panelKeys.indexOf(normalized) >= 0 ? normalized : 'registry';
      }

      function normalizeCurrentView(value) {
        const normalized = normalizeText(value);
        return normalized === 'object' || normalized === 'analytics' ? normalized : 'registry';
      }

      function isCompactSidebarViewport() {
        try {
          return !!(window && typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 980px)').matches);
        } catch (_error) {
          return false;
        }
      }

      function applyBootNavState() {
        const currentViewNormalizer = typeof normalizeCurrentView === 'function'
          ? normalizeCurrentView
          : value => {
              const normalized = normalizeText(value);
              return normalized === 'object' || normalized === 'analytics' ? normalized : 'registry';
            };
        const sidebarPanelNormalizer = typeof normalizeSidebarPanel === 'function'
          ? normalizeSidebarPanel
          : value => {
              const normalized = normalizeText(value);
              return panelKeys.indexOf(normalized) >= 0 ? normalized : 'registry';
            };
        const currentView = currentViewNormalizer(bootNav && bootNav.currentView);
        const sidebarExpanded = bootNav && bootNav.sidebarExpanded !== undefined ? !!bootNav.sidebarExpanded : true;
        const activePanel = sidebarPanelNormalizer(bootNav && bootNav.sidebarActivePanel);
        const registrySidebarPanelOpen = !(bootNav && bootNav.registrySidebarPanelOpen === false);
        const activePanelForUi = currentView === 'object' && activePanel === 'registry' ? '' : activePanel;
        const isRegistryPanelOpen = activePanelForUi === 'registry' && registrySidebarPanelOpen;
        const visibleExpanded = sidebarExpanded || isCompactSidebarViewport();
        const appShell = document.getElementById('appShell');
        const sidebar = document.getElementById('appSidebar');
        const toggleButton = document.getElementById('btnSidebarCollapse');

        if (appShell) appShell.classList.toggle('sidebar-expanded', visibleExpanded);
        if (sidebar) {
          sidebar.classList.toggle('is-expanded', visibleExpanded);
          sidebar.classList.toggle('is-collapsed', !visibleExpanded);
        }
        if (toggleButton) {
          const label = visibleExpanded ? 'Свернуть меню' : 'Раскрыть меню';
          toggleButton.classList.toggle('is-expanded', visibleExpanded);
          toggleButton.title = label;
          toggleButton.setAttribute('aria-label', label);
        }

        panelKeys.forEach(key => {
          const button = document.getElementById(buttonIds[key]);
          const panel = document.getElementById(panelIds[key]);
          const active = key === activePanelForUi;
          const expandedForButton = key === 'registry' ? isRegistryPanelOpen : active;
          const shouldOpen = key === 'registry' ? isRegistryPanelOpen : key === activePanelForUi;

          if (button) {
            button.classList.toggle('is-active', active);
            button.setAttribute('aria-pressed', active ? 'true' : 'false');
            if (button.classList.contains('nav-button-expandable')) {
              button.setAttribute('aria-expanded', expandedForButton ? 'true' : 'false');
            }
            const item = button.closest('.nav-item');
            if (item) item.classList.toggle('is-open', expandedForButton);
          }

          if (panel) {
            panel.classList.toggle('hidden', !shouldOpen);
            panel.dataset.collapsibleState = shouldOpen ? 'open' : 'closed';
            panel.style.transition = 'none';
            panel.style.overflow = '';
            panel.style.willChange = '';
            panel.style.opacity = '';
            panel.style.transform = '';
            panel.style.maxHeight = '';
          }
        });
      }

      function applyBootAdminState() {
        if (!bootSession || !bootSession.user || !bootSession.sessionToken) return;
        const user = bootSession.user;
        const apps = user.apps && typeof user.apps === 'object' && !Array.isArray(user.apps) ? user.apps : {};
        const siteProfile = apps.site && typeof apps.site === 'object' ? apps.site : null;
        const role = normalizeText((siteProfile && siteProfile.role) || user.role).toLowerCase();
        const isAdmin = /admin|админ/.test(role);
        const editButton = document.getElementById('btnAdminRegistryEditMode');
        if (editButton) editButton.classList.toggle('hidden', !isAdmin);
      }

      applyBootNavState();
      applyBootAdminState();

      const body = document.body;
      const overlay = document.getElementById('authOverlay');
      if (bootSession && bootSession.user && bootSession.sessionToken) {
        if (overlay) overlay.classList.add('hidden');
      } else if (overlay) {
        overlay.classList.remove('hidden');
      }
      if (body) body.classList.remove('site-shell-booting');
    })();
  </script>
