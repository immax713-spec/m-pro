name: Deploy mpro7.ru /77

on:
  workflow_dispatch:

concurrency:
  group: deploy-mpro7-77
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Normalize deploy vars
        shell: bash
        run: |
          set -euo pipefail
          host='${{ secrets.SERVER_HOST }}'
          user='${{ secrets.SERVER_USER }}'
          port='${{ secrets.SERVER_PORT }}'
          path='${{ secrets.SERVER_PATH }}'

          host="$(echo "$host" | tr -d '\r' | xargs)"
          user="$(echo "$user" | tr -d '\r' | xargs)"
          port="$(echo "$port" | tr -d '\r' | xargs)"
          path="$(echo "$path" | tr -d '\r' | xargs)"

          if [[ -z "$port" || ! "$port" =~ ^[0-9]+$ ]]; then
            echo "SERVER_PORT is invalid, fallback to 22"
            port="22"
          fi

          if [[ -z "$path" ]]; then
            path="/var/www/mpro7.ru"
          elif [[ "$path" != /* ]]; then
            path="/var/www/$path"
          fi

          target_path="${path%/}/77"
          backup_path="${path%/}/77.bak"
          archive_path="${path%/}/.deploy-77-${GITHUB_SHA}.tar.gz"
          release_path="${path%/}/.deploy-77-${GITHUB_SHA}"

          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$port" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=$path" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET_PATH=$target_path" >> "$GITHUB_ENV"
          echo "DEPLOY_BACKUP_PATH=$backup_path" >> "$GITHUB_ENV"
          echo "DEPLOY_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "DEPLOY_RELEASE_PATH=$release_path" >> "$GITHUB_ENV"

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create deployment archive
        run: |
          tar --exclude='site/src/app/40-ui.js.bak_test' -czf deploy-77.tar.gz \
            index.html \
            mpro.html \
            build-manifest.json \
            README.md \
            site \
            mpro \
            vendor

      - name: Ensure deploy root exists
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            mkdir -p "'"$DEPLOY_PATH"'"
          '

      - name: Upload archive
        run: |
          scp -P "$DEPLOY_PORT" \
            ./deploy-77.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ARCHIVE_PATH"

      - name: Extract and atomically replace /77
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            rm -rf "'"$DEPLOY_RELEASE_PATH"'"
            mkdir -p "'"$DEPLOY_RELEASE_PATH"'"
            tar -xzf "'"$DEPLOY_ARCHIVE_PATH"'" -C "'"$DEPLOY_RELEASE_PATH"'"
            rm -f "'"$DEPLOY_ARCHIVE_PATH"'"
            rm -rf "'"$DEPLOY_BACKUP_PATH"'"
            if [ -d "'"$DEPLOY_TARGET_PATH"'" ]; then
              mv "'"$DEPLOY_TARGET_PATH"'" "'"$DEPLOY_BACKUP_PATH"'"
            fi
            mv "'"$DEPLOY_RELEASE_PATH"'" "'"$DEPLOY_TARGET_PATH"'"
            find "'"$DEPLOY_TARGET_PATH"'" -type d -exec chmod 755 {} +
            find "'"$DEPLOY_TARGET_PATH"'" -type f -exec chmod 644 {} +
          '
