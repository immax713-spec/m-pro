server {
    listen 80;
    listen [::]:80;
    server_name mpro7.ru www.mpro7.ru 130.193.44.178;

    root /var/www/html/current;
    index index.html;

    location = /77 {
        return 301 /77/;
    }

    # Keep the legacy /77 route on the current production server.
    location ^~ /77/ {
        proxy_pass https://147.45.163.242;
        proxy_http_version 1.1;
        proxy_set_header Host mpro7.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name mpro7.ru;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

